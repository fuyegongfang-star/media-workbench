# 开发/单机部署依赖：PostgreSQL 16 + Redis（BullMQ）
# 用法：cp .env.example .env 后填写 POSTGRES_* / REDIS_*，再执行 docker compose up -d
# 变量取自同目录 .env（Compose 自动加载），本文件不含任何明文密钥
services:
  postgres:
    image: postgres:16-alpine
    container_name: mw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-media_workbench}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?请在 .env 中设置 POSTGRES_USER} -d ${POSTGRES_DB:-media_workbench}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mw-redis
    restart: unless-stopped
    # 生产环境建议设置 requirepass（REDIS_PASSWORD），此处仅开发用
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --appendonly yes; fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
