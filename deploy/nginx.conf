# 前端静态托管 + /api 反向代理（容器内）
# 对外 HTTPS 由宝塔站点 / 云负载均衡终止后再反代到 WEB_PORT。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与 .env 的 MEDIA_MAX_UPLOAD_BYTES（默认 50MB）保持一致
    client_max_body_size 50m;

    # 任务中心 SSE 需要关闭缓冲、放宽读超时
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vue Router history 模式：找不到静态资源时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长缓存；入口 html 不缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
