    <rect x="302" y="350" width="34" height="48" rx="4" fill="#bfdbfe"/>
    <rect x="362" y="326" width="34" height="72" rx="4" fill="#93c5fd"/>
    <rect x="422" y="338" width="34" height="60" rx="4" fill="#bfdbfe"/>
    <rect x="482" y="302" width="34" height="96" rx="4" fill="#60a5fa"/>
    <rect x="542" y="318" width="34" height="80" rx="4" fill="#93c5fd"/>
    <rect x="602" y="288" width="34" height="110" rx="4" fill="#3b82f6"/>
    <rect x="662" y="306" width="34" height="92" rx="4" fill="#60a5fa"/>
    <rect x="722" y="274" width="34" height="124" rx="4" fill="#3b82f6"/>

    <!-- recent radar brief -->
    <rect x="850" y="258" width="320" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="870" y="286" font-size="14" font-weight="700" fill="#334155">最近选题简报</text>
    <line x1="870" y1="298" x2="1150" y2="298" stroke="#f1f5f9"/>
    <text x="870" y="326" font-size="17" font-weight="700" fill="#0f172a">2026-11-16</text>
    <rect x="1010" y="308" width="52" height="22" rx="11" fill="#e8f6ef"/>
    <text x="1020" y="323" font-size="11" fill="#2f8f6b">已完成</text>
    <rect x="870" y="340" width="136" height="52" rx="8" fill="#f5f7fa"/>
    <text x="884" y="368" font-size="19" font-weight="700" fill="#0f172a">84</text>
    <text x="884" y="384" font-size="10.5" fill="#64748b">采集条目</text>
    <rect x="1018" y="340" width="136" height="52" rx="8" fill="#f5f7fa"/>
    <text x="1032" y="368" font-size="19" font-weight="700" fill="#0f172a">12</text>
    <text x="1032" y="384" font-size="10.5" fill="#64748b">精选推荐</text>
    <text x="870" y="414" font-size="11" fill="#94a3b8">运营待办 9 · 队列任务 2 · 自有账号 4</text>

    <!-- recent list -->
    <rect x="270" y="444" width="900" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
