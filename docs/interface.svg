<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="工作台界面结构示意：侧栏导航、KPI 卡片、产出趋势图与依赖健康状态">
  <defs>
    <clipPath id="win"><rect x="30" y="24" width="1140" height="500" rx="14"/></clipPath>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect width="1200" height="580" rx="18" fill="#f8fafc"/>
    <rect x="1" y="1" width="1198" height="578" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

    <rect x="30" y="24" width="1140" height="500" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <g clip-path="url(#win)">
      <!-- window bar -->
      <rect x="30" y="24" width="1140" height="44" fill="#f1f5f9"/>
      <line x1="30" y1="68" x2="1170" y2="68" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="54" cy="46" r="6" fill="#f87171"/>
      <circle cx="74" cy="46" r="6" fill="#fbbf24"/>
      <circle cx="94" cy="46" r="6" fill="#34d399"/>
      <rect x="130" y="34" width="420" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="146" y="50" font-size="11.5" fill="#94a3b8">app.example.com/dashboard</text>

      <!-- sidebar -->
      <rect x="30" y="68" width="210" height="456" fill="#1e293b"/>
      <text x="50" y="104" font-size="14" font-weight="700" fill="#f8fafc">◧ 自媒体工作台</text>
      <rect x="42" y="126" width="186" height="30" rx="8" fill="#334155"/>
      <rect x="52" y="137" width="8" height="8" rx="2" fill="#60a5fa"/>
      <text x="70" y="146" font-size="12.5" font-weight="600" fill="#f1f5f9">工作台</text>
      <rect x="52" y="169" width="8" height="8" rx="2" fill="#64748b"/><text x="70" y="178" font-size="12.5" fill="#94a3b8">内容项目</text>
      <rect x="52" y="201" width="8" height="8" rx="2" fill="#64748b"/><text x="70" y="210" font-size="12.5" fill="#94a3b8">对标分析</text>
      <rect x="52" y="233" width="8" height="8" rx="2" fill="#64748b"/><text x="70" y="242" font-size="12.5" fill="#94a3b8">账号与策略</text>
      <rect x="52" y="265" width="8" height="8" rx="2" fill="#64748b"/><text x="70" y="274" font-size="12.5" fill="#94a3b8">素材库</text>
      <rect x="52" y="297" width="8" height="8" rx="2" fill="#64748b"/><text x="70" y="306" font-size="12.5" fill="#94a3b8">内容日历</text>
      <rect x="52" y="329" width="8" height="8" rx="2" fill="#64748b"/><text x="70" y="338" font-size="12.5" fill="#94a3b8">效果看板</text>
      <rect x="52" y="361" width="8" height="8" rx="2" fill="#64748b"/><text x="70" y="370" font-size="12.5" fill="#94a3b8">系统设置</text>
      <rect x="52" y="393" width="8" height="8" rx="2" fill="#64748b"/><text x="70" y="402" font-size="12.5" fill="#94a3b8">可观测性</text>
      <line x1="50" y1="430" x2="220" y2="430" stroke="#334155"/>
      <text x="50" y="458" font-size="11" fill="#64748b">12 个导航入口</text>
      <text x="50" y="478" font-size="11" fill="#64748b">+ 内容项目详情页</text>
    </g>

    <!-- main header -->
    <text x="270" y="110" font-size="22" font-weight="700" fill="#0f172a">工作台</text>
    <text x="270" y="132" font-size="12" fill="#94a3b8">服务与内容生产概览</text>
    <circle cx="1132" cy="108" r="17" fill="#c7d2fe"/>
    <text x="1126" y="113" font-size="13" font-weight="700" fill="#4338ca">A</text>

    <!-- KPI cards -->
    <rect x="270" y="152" width="210" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="286" y="178" font-size="11.5" fill="#94a3b8">内容项目</text>
    <text x="286" y="212" font-size="26" font-weight="700" fill="#0f172a">128</text>
    <text x="286" y="230" font-size="11" fill="#10b981">▲ 12 本周新增</text>

    <rect x="500" y="152" width="210" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="516" y="178" font-size="11.5" fill="#94a3b8">待审核</text>
    <text x="516" y="212" font-size="26" font-weight="700" fill="#0f172a">7</text>
    <text x="516" y="230" font-size="11" fill="#f59e0b">需人工处理</text>

    <rect x="730" y="152" width="210" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="746" y="178" font-size="11.5" fill="#94a3b8">本月发布</text>
    <text x="746" y="212" font-size="26" font-weight="700" fill="#0f172a">36</text>
    <text x="746" y="230" font-size="11" fill="#10b981">▲ 8 较上月</text>

    <rect x="960" y="152" width="210" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="976" y="178" font-size="11.5" fill="#94a3b8">模型成本</text>
    <text x="976" y="212" font-size="26" font-weight="700" fill="#0f172a">¥84.6</text>
    <text x="976" y="230" font-size="11" fill="#64748b">本月累计</text>

    <!-- trend chart -->
    <rect x="270" y="258" width="560" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="290" y="286" font-size="14" font-weight="700" fill="#334155">内容产出趋势</text>
    <text x="750" y="286" font-size="11" fill="#94a3b8">近 8 周</text>
    <line x1="290" y1="398" x2="810" y2="398" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="302" y="350" width="34" height="48" rx="4" fill="#bfdbfe"/>
    <rect x="362" y="326" width="34" height="72" rx="4" fill="#93c5fd"/>
    <rect x="422" y="338" width="34" height="60" rx="4" fill="#bfdbfe"/>
    <rect x="482" y="302" width="34" height="96" rx="4" fill="#60a5fa"/>
    <rect x="542" y="318" width="34" height="80" rx="4" fill="#93c5fd"/>
    <rect x="602" y="288" width="34" height="110" rx="4" fill="#3b82f6"/>
    <rect x="662" y="306" width="34" height="92" rx="4" fill="#60a5fa"/>
    <rect x="722" y="274" width="34" height="124" rx="4" fill="#3b82f6"/>

    <!-- health card -->
    <rect x="850" y="258" width="320" height="170" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="870" y="286" font-size="14" font-weight="700" fill="#334155">依赖状态</text>
    <line x1="870" y1="298" x2="1150" y2="298" stroke="#f1f5f9"/>
    <circle cx="876" cy="320" r="5" fill="#10b981"/><text x="890" y="324" font-size="12.5" fill="#334155">PostgreSQL 16</text><text x="1110" y="324" font-size="11.5" fill="#10b981">在线</text>
    <circle cx="876" cy="350" r="5" fill="#10b981"/><text x="890" y="354" font-size="12.5" fill="#334155">Redis 7</text><text x="1110" y="354" font-size="11.5" fill="#10b981">在线</text>
    <circle cx="876" cy="380" r="5" fill="#10b981"/><text x="890" y="384" font-size="12.5" fill="#334155">BullMQ Worker</text><text x="1110" y="384" font-size="11.5" fill="#10b981">运行中</text>
    <circle cx="876" cy="410" r="5" fill="#f59e0b"/><text x="890" y="414" font-size="12.5" fill="#334155">AI 供应商</text><text x="1104" y="414" font-size="11.5" fill="#f59e0b">待配置</text>

    <!-- recent list -->
    <rect x="270" y="444" width="900" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="290" y="468" font-size="13" font-weight="700" fill="#334155">最近内容项目</text>
    <line x1="290" y1="478" x2="1150" y2="478" stroke="#f1f5f9"/>
    <text x="290" y="494" font-size="11.5" fill="#64748b">立项　→　AI 初稿　→　待审　→　已发布　·　每一步都留版本与审核意见</text>

    <text x="40" y="558" font-size="13" fill="#64748b">界面结构示意 · 双击仓库根 preview.html 可查看零依赖离线快照（暗色主题、非实时、按钮不可提交）</text>
  </g>
</svg>
