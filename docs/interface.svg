<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="工作台界面结构示意：分组侧栏、业务总览 KPI、项目进度分布与最近选题简报">
  <defs>
